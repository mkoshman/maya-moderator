<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flario Game: новые форматы геймификации</title>
<style>:root{
  --bg:#faf7f9;--crimson:#af004e;--crimson-dark:#7e0038;--crimson2:#d4005f;--blush:#ffd9ea;
  --surface:#fff;--surface-soft:#f5f0f3;--border:#ecdde6;--border2:#ddc9d5;
  --text:#1a1118;--muted:#7a5f70;--text3:#b89aaa;
  --green:#27500a;--green-bg:#eaf3de;--amber:#633806;--amber-bg:#faeeda;--red:#a32d2d;--red-bg:#fcebeb;
  --s:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Geologica,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
#deck{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 56px;height:100vh}
#side{grid-row:1/3;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:18px 12px 24px}
#side .brand{font-weight:700;color:var(--crimson);font-size:18px;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
#side .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:14px 10px 4px;font-weight:600}
#side a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;cursor:pointer}
#side a:hover{background:var(--surface-soft)}
#side a.on{background:var(--blush);color:var(--crimson-dark);font-weight:600}
#side a .play{font-size:11px;color:var(--crimson)}
#stage{overflow:auto;position:relative}
#bar{display:flex;align-items:center;gap:12px;padding:0 20px;border-top:1px solid var(--border);background:#fff}
#bar .grow{flex:1;height:6px;border-radius:3px;background:var(--surface-soft);overflow:hidden}
#bar .grow i{display:block;height:100%;background:var(--crimson);transition:width .3s}
#bar .cnt{font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.btn{border:1px solid var(--border2);background:#fff;color:var(--text);border-radius:12px;padding:8px 16px;font-size:14px;font-weight:500;transition:.15s}
.btn:hover{background:var(--surface-soft)}
.btn.pri{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.btn.pri:hover{background:var(--crimson-dark)}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default}

.slide{padding:28px 40px 40px;max-width:1280px;margin:0 auto;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide h1{font-size:34px;line-height:1.2;margin:0 0 8px;color:var(--crimson-dark)}
.slide h2{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--crimson-dark)}
.slide h3{font-size:16px;margin:18px 0 6px;color:var(--crimson)}
.slide p{margin:6px 0}
.lead{font-size:18px;color:var(--muted);max-width:720px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--blush);color:var(--crimson-dark);margin-right:6px}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.a{background:var(--amber-bg);color:var(--amber)}
.pill.r{background:var(--red-bg);color:var(--red)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:36px;align-items:start}
.split.wide{grid-template-columns:minmax(0,1fr) 520px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px 18px;margin:12px 0}
.card h4{margin:0 0 6px;font-size:14px;color:var(--crimson);text-transform:uppercase;letter-spacing:.04em}
.card.now{background:var(--green-bg);border-color:#cfe3b8}
.card.now h4{color:var(--green)}
.card.future{background:#f6f0fb;border-color:#e0d3f0}
.card.future h4{color:#5b3a8c}
.card.miss{background:var(--amber-bg);border-color:#efd5a8}
.card.miss h4{color:var(--amber)}
.card ul,.card ol{margin:4px 0 4px 18px;padding:0}
.card li{margin:3px 0}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.tile{background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px 16px;cursor:pointer;transition:.15s;text-align:left}
.tile:hover{border-color:var(--crimson);transform:translateY(-2px);box-shadow:0 6px 18px rgba(175,0,78,.1)}
.tile b{display:block;color:var(--crimson-dark)}
.tile span{font-size:13px;color:var(--muted)}
.hero{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.hero h1{font-size:46px}
.divider{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center}
.divider .num{font-size:90px;font-weight:800;color:var(--blush);line-height:1}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
table.t th{background:var(--surface-soft);text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.t td{padding:9px 12px;border-top:1px solid var(--border);vertical-align:top}
table.t td.ok{background:var(--green-bg);color:var(--green);text-align:center;font-weight:600}
table.t td.no{background:var(--red-bg);color:var(--red);text-align:center;font-weight:600}
table.t td.mid{background:var(--amber-bg);color:var(--amber);text-align:center;font-weight:600}
table.t td.self{background:var(--surface-soft);text-align:center;color:var(--text3)}

/* phone */
.phone-wrap{width:420px;height:calc(660px * var(--s));display:flex;justify-content:center;position:sticky;top:12px}
.phone{width:380px;height:640px;border-radius:38px;background:#1a1118;padding:10px;transform:scale(var(--s));transform-origin:top center;box-shadow:0 20px 50px rgba(126,0,56,.22);flex:none}
.phone-screen{width:100%;height:100%;border-radius:30px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column}
.app-bar{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;background:#fff;border-bottom:1px solid var(--border);flex:none}
.app-back{font-size:22px;color:var(--crimson);width:20px}
.app-title{flex:1;min-width:0;line-height:1.2}
.app-title b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-title small{font-size:11px;color:var(--muted)}
.chip{background:var(--blush);color:var(--crimson-dark);font-weight:700;font-size:12px;border-radius:14px;padding:4px 9px;white-space:nowrap}
.app-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:8px 8px 10px;user-select:none;-webkit-user-select:none;touch-action:none}
.g-top{display:flex;gap:6px;align-items:center;justify-content:space-between;width:100%;font-size:13px;color:var(--muted);padding:0 4px 6px;flex:none}
.g-top b{color:var(--crimson-dark)}
.g-note{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:6px;flex:none}
.tabs button{border:1px solid var(--border2);background:#fff;border-radius:16px;padding:4px 12px;font-size:12px;color:var(--muted)}
.tabs button.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.overlay{position:absolute;inset:0;background:rgba(250,247,249,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;z-index:50;animation:fade .25s}
.overlay h3{margin:0;font-size:22px;color:var(--crimson-dark)}
.overlay p{margin:0;color:var(--muted);font-size:14px}
.overlay.lose h3{color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .25s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 1.6s ease-in-out infinite}

/* flasks */
.flasks{display:grid;grid-template-columns:repeat(3,92px);gap:14px 20px;justify-content:center;margin-top:8px}
.fl{position:relative;height:150px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.fl.sel{transform:translateY(-12px)}
.fl .glass{width:50px;height:124px;border:3px solid #cdb3c3;border-top:none;border-radius:0 0 22px 22px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.2));display:flex;flex-direction:column-reverse;overflow:hidden;position:relative;margin-top:22px}
.fl.sel .glass{border-color:var(--crimson)}
.fl .glass:before{content:"";position:absolute;top:0;left:-3px;right:-3px;height:0}
.fl .lip{position:absolute;top:18px;width:62px;height:6px;border-radius:4px;background:#cdb3c3}
.fl.sel .lip{background:var(--crimson)}
.fl .seg{flex:none;height:25%;width:100%;transition:background .2s;border-top:1px solid rgba(255,255,255,.4)}
.fl .done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;animation:pop .4s}
.fl .done small{font-size:10px;line-height:1.1;text-align:center;color:var(--crimson-dark);font-weight:600;max-width:90px}
.row-btns{display:flex;gap:8px;margin-top:10px;flex:none}

/* words */
.wheel{position:relative;width:250px;height:250px;margin:6px auto 0;border-radius:50%;background:#fff;border:1px solid var(--border);touch-action:none}
.wheel .lt{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--surface-soft);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--crimson-dark)}
.wheel .lt.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.wheel svg{position:absolute;inset:0;pointer-events:none}
.slots{display:flex;gap:5px;justify-content:center;margin:6px 0;min-height:40px}
.slots i{width:34px;height:40px;border-radius:8px;border:2px solid var(--border2);background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:var(--crimson-dark);font-size:18px}
.slots i.f{background:var(--green-bg);border-color:#9ec47c;color:var(--green)}
.fw{display:grid;grid-template-columns:repeat(8,38px);gap:2px;justify-content:center;touch-action:none;margin-top:4px}
.fw div{width:38px;height:38px;border-radius:8px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--text)}
.fw div.sel{background:var(--blush);border-color:var(--crimson2)}
.fw div.fd{background:var(--green-bg);border-color:#9ec47c;color:var(--green)}
.wl{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.wl .fd{text-decoration:line-through;color:var(--green)}

/* pyramid */
.pyr{position:relative;width:340px;height:270px;margin-top:4px;flex:none}
.tl{position:absolute;width:40px;height:50px;border-radius:9px;background:#fff;border:2px solid var(--border2);box-shadow:0 3px 0 var(--border2);display:flex;align-items:center;justify-content:center;transition:.2s;padding:0}
.tl.free{border-color:var(--crimson);box-shadow:0 3px 0 var(--crimson)}
.tl.cov{background:#e6dbe1;cursor:default}
.tl.cov svg{opacity:.35}
.hand{display:flex;gap:6px;margin-top:10px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:14px;flex:none}
.hand .sl{width:46px;height:56px;border-radius:9px;border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center}
.hand .sl.f{border-style:solid;border-color:var(--crimson);background:var(--blush)}

/* steps */
.stp{display:flex;flex-direction:column;gap:8px;width:100%;padding:0 6px;margin-top:6px}
.stp button{border:1.5px solid var(--border2);background:#fff;border-radius:14px;padding:10px 14px;text-align:left;font-size:14px;color:var(--text)}
.stp button:hover{border-color:var(--crimson)}
.stp button.ok{background:var(--green-bg);border-color:#9ec47c;color:var(--green)}
.stp button.bad{background:var(--red-bg);border-color:#e29a9a;color:var(--red)}
.seq{display:flex;gap:6px;margin:6px 0}
.seq i{width:30px;height:30px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:var(--text3);font-weight:700}
.seq i.f{background:var(--green);border-color:var(--green);color:#fff}

/* baskets */
.bk{position:relative;width:340px;height:440px;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;flex:none;touch-action:none}
.bk .lane{position:absolute;top:0;bottom:0;border-right:1px dashed var(--border)}
.bk .jar{position:absolute;width:44px;text-align:center;font-size:9px;line-height:1.1;color:var(--muted);margin-left:-22px}
.bk .bsk{position:absolute;bottom:6px;height:64px;border-radius:6px 6px 18px 18px;background:var(--blush);border:2px solid var(--crimson2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--crimson-dark);text-align:center;transition:left .5s}
.bk .bsk.flip{animation:pop .4s}
.bk .rot{position:absolute;left:0;top:0;height:4px;background:var(--crimson);transition:width .1s linear}

/* find */
.scene{width:340px;height:330px;border-radius:14px;border:1px solid var(--border);background:#fff;flex:none;touch-action:manipulation}
.finds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;margin-top:8px;padding:0 6px}
.finds div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:3px 0 1px;text-align:center;font-size:9px;color:var(--muted);line-height:1.1}
.finds div.fd{background:var(--green-bg);border-color:#9ec47c;color:var(--green);text-decoration:line-through}
.tbar{width:100%;height:8px;background:var(--surface-soft);border-radius:4px;overflow:hidden;margin:2px 0 6px;flex:none}
.tbar i{display:block;height:100%;background:var(--crimson);width:100%}

/* head */
.headbox{position:relative;width:340px;height:200px;flex:none}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:6px;padding:0 4px}
.menu button{border:1.5px solid var(--border2);background:#fff;border-radius:12px;padding:5px 2px;font-size:10px;line-height:1.1;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px}
.menu button.on{border-color:var(--crimson);background:var(--blush)}
.menu button.dis{opacity:.4}
.prog{width:100%;height:10px;background:var(--surface-soft);border-radius:5px;overflow:hidden;margin:4px 0;flex:none}
.prog i{display:block;height:100%;width:0;background:var(--crimson2);transition:width .1s}
.stepline{display:flex;gap:3px;margin:2px 0 6px;flex:none}
.stepline i{width:30px;height:8px;border-radius:4px;background:var(--border2)}
.stepline i.f{background:var(--green)}
.stepline i.c{background:var(--crimson2)}
.stepline i.p{box-shadow:0 0 0 2px #3b82c4 inset}
.role{font-size:12px;padding:3px 10px;border-radius:12px;background:#e6f0fa;color:#1c4f82;font-weight:600}
.role.me{background:var(--blush);color:var(--crimson-dark)}

/* spa */
.spa{position:relative;width:344px;height:470px;background:#fbeff5;border-radius:16px;border:1px solid var(--border);overflow:hidden;flex:none;touch-action:manipulation}
.spa .st{position:absolute;transform:translate(-50%,-50%);border-radius:14px;background:#fff;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.1;color:var(--muted);cursor:pointer;padding:2px}
.spa .st.shelf{width:78px;height:40px;font-size:9px;border-color:var(--crimson2);color:var(--crimson-dark);font-weight:600}
.spa .st.seat{width:76px;height:64px;background:#eef6fc;border-color:#9bbbd8}
.spa .st.desk{width:110px;height:44px;background:var(--amber-bg);border-color:#e3b873}
.spa .st.sink{width:76px;height:64px;background:#e3f0fa;border-color:#6aa2d2}
.spa .st.door{width:120px;height:28px;border-style:dashed;cursor:default}
.spa .ppl{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:5;cursor:pointer}
.spa .chef{z-index:8}
.spa .chef.sel{filter:drop-shadow(0 0 5px #af004e)}
.spa .bub{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;border:1px solid var(--border2);border-radius:8px;padding:2px 5px;font-size:9px;width:100px;text-align:center;line-height:1.25;color:var(--text)}
.spa .pat{position:absolute;left:0;right:0;top:32px;height:4px;background:#ddd;border-radius:2px;overflow:hidden}
.spa .pat i{display:block;height:100%;background:var(--green)}
.spa .hold{position:absolute;top:-12px;left:18px;font-size:9px;background:var(--crimson);color:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.spa .work{position:absolute;left:-6px;right:-6px;top:-8px;height:4px;background:#ddd;border-radius:2px;overflow:hidden}
.spa .work i{display:block;height:100%;background:var(--crimson2)}

/* pair shell */
.mini{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px;gap:8px;overflow:auto}
.person{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--border);border-radius:14px;background:#fff;cursor:pointer}
.person.on{border-color:var(--crimson);background:var(--blush)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--crimson)}

/* settings */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:100%}
.cal b{font-size:11px;text-align:center;color:var(--text3);font-weight:500}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:12px;position:relative;color:var(--text);padding:0}
.cal button.sh{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.cal button.off{background:var(--surface-soft);color:var(--text3)}
.cal button .ev{position:absolute;right:2px;top:0;font-size:10px}
.note{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;justify-content:space-between;width:100%}
.note button{border:none;background:none;color:var(--text3);font-size:16px}
input.in,textarea.in{width:100%;border:1.5px solid var(--border2);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;background:#fff}
.slider{width:100%;accent-color:var(--crimson)}

/* planner */
.plan{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.plan label{font-size:12px;font-weight:700;color:var(--crimson-dark);display:block;margin-bottom:2px}
.plan select{width:100%;padding:7px 4px;border-radius:10px;border:1.5px solid var(--border2);font:inherit;font-size:12px;background:#fff}
.chk{margin:4px 0;padding:6px 10px;border-radius:10px;font-size:13px}
.chk.ok{background:var(--green-bg);color:var(--green)}
.chk.bad{background:var(--red-bg);color:var(--red)}
.pic{background:#fff;border:1px solid var(--border);border-radius:18px;padding:10px}
.pic svg{width:100%;height:auto;display:block}
.cap{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}
.kbd{font-size:12px;color:var(--muted)}
@media(max-width:1000px){#deck{grid-template-columns:1fr}#side{display:none}.split,.split.wide{grid-template-columns:1fr}.slide{padding:20px}.phone-wrap{margin:0 auto;position:static}}
</style>
</head>
<body>
<div id="deck">
  <nav id="side"></nav>
  <main id="stage"></main>
  <div id="bar">
    <button class="btn prev">← Назад</button>
    <div class="grow"><i></i></div>
    <div class="cnt"></div>
    <button class="btn pri next">Дальше →</button>
  </div>
</div>
<script>(function () {
  const NS = 'http://www.w3.org/2000/svg';
  function mk(ns, tag, attrs, kids) {
    const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.setAttribute('class', v);
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    const add = (c) => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) c.forEach(add);

(function () {
  const { h, s, U } = Core;

  Games.words = function (body) {
    let mode = 'wheel';
    let dead = false;

    const ROUNDS = [
      { w: 'СЕРИН', hint: 'Аминокислота из состава Multiuse Shampoo' },
      { w: 'ПРОЛИН', hint: 'Ещё одна аминокислота из состава шампуня' },
      { w: 'ЛИЗИН', hint: 'И ещё одна, из того же списка' },
    ];
    const FW = ['ШАМПУНЬ', 'СЕРИН', 'ЛИЗИН', 'ПРОЛИН', 'АЛАНИН', 'ГЛИЦИН'];

    function wheel() {
      let round = 0, picked = [], dragging = false, nodes = [];
      body.innerHTML = '';
      body.append(tabs());
      const info = h('div', { class: 'g-top' });
      const slots = h('div', { class: 'slots' });
      const wh = h('div', { class: 'wheel' });
      const line = s('svg', { width: 250, height: 250 });
      const poly = s('polyline', { points: '', fill: 'none', stroke: '#d4005f', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .5 });
      line.append(poly);
      body.append(info, slots, wh);
      body.append(h('div', { class: 'g-note' }, 'Проведи пальцем по буквам по кругу, чтобы собрать слово. Не отпускай, пока не соберёшь до конца.'));

      function setup() {
        const r = ROUNDS[round];
        info.innerHTML = '';
        info.append(h('span', {}, r.hint), h('b', {}, (round + 1) + ' / ' + ROUNDS.length));
        slots.innerHTML = '';
        r.w.split('').forEach(() => slots.append(h('i')));
        wh.innerHTML = ''; wh.append(line);
        picked = []; poly.setAttribute('points', '');
        let letters = r.w.split('');
        let sh;
        do { sh = U.shuffle(letters); } while (sh.join('') === r.w);
        nodes = sh.map((ch, i) => {
          const a = (i / sh.length) * Math.PI * 2 - Math.PI / 2;
          const n = h('div', { class: 'lt', style: { left: 125 + Math.cos(a) * 88 + 'px', top: 125 + Math.sin(a) * 88 + 'px' } }, ch);
          n.dataset.i = i; n.dataset.ch = ch;
          wh.append(n);
          return n;
        });
      }
      function center(n) { return [parseFloat(n.style.left), parseFloat(n.style.top)]; }
      function draw() {
        poly.setAttribute('points', picked.map((n) => center(n).join(',')).join(' '));
        [...slots.children].forEach((c, i) => { c.textContent = picked[i] ? picked[i].dataset.ch : ''; });
        nodes.forEach((n) => n.classList.toggle('on', picked.includes(n)));
      }
      function hit(e) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        return el && el.classList.contains('lt') && wh.contains(el) ? el : null;
      }
      wh.addEventListener('pointerdown', (e) => {
        const n = hit(e);
        if (!n) return;
        dragging = true; picked = [n]; draw();
        wh.setPointerCapture(e.pointerId);
      });
      wh.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const n = hit(e);
        if (n && !picked.includes(n)) { picked.push(n); draw(); }
      });
      const end = () => {
        if (!dragging) return;
        dragging = false;
        const word = picked.map((n) => n.dataset.ch).join('');
        if (word === ROUNDS[round].w) {
          [...slots.children].forEach((c) => c.classList.add('f'));
          setTimeout(() => {
            if (dead) return;
            round++;
            if (round >= ROUNDS.length) Core.result(body, { win: true, text: 'Все три слова из состава собраны.', retryLabel: 'Теперь филворд', onRetry: () => { mode = 'fw'; filword(); } });
            else setup();
          }, 600);
        } else {
          wh.classList.add('shake');
          setTimeout(() => { wh.classList.remove('shake'); picked = []; draw(); }, 260);
        }
      };
      wh.addEventListener('pointerup', end);
      wh.addEventListener('pointercancel', end);
      setup();
    }

    function filword() {
      const N = 8;
      let grid = null;
      const dirs = [[1, 0], [0, 1], [1, 1]];
      function build() {
        for (let attempt = 0; attempt < 200; attempt++) {
          const g = Array.from({ length: N }, () => Array(N).fill(''));
          let ok = true;
          for (const w of U.shuffle(FW).sort((a, b) => b.length - a.length)) {
            let placed = false;
            for (let t = 0; t < 120 && !placed; t++) {
              const d = U.pick(dirs);
              const rev = Math.random() < .3;
              const word = rev ? w.split('').reverse().join('') : w;
              const x = U.ri(0, N - 1), y = U.ri(0, N - 1);
              const ex = x + d[0] * (word.length - 1), ey = y + d[1] * (word.length - 1);
              if (ex >= N || ey >= N) continue;
              let fit = true;
              for (let i = 0; i < word.length; i++) {
                const c = g[y + d[1] * i][x + d[0] * i];
                if (c && c !== word[i]) { fit = false; break; }
              }
              if (!fit) continue;
              for (let i = 0; i < word.length; i++) g[y + d[1] * i][x + d[0] * i] = word[i];
              placed = true;
            }
            if (!placed) { ok = false; break; }
          }
          if (ok) {
            const abc = 'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ';
            for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!g[y][x]) g[y][x] = U.pick(abc.split(''));
            return g;
          }
        }
        return null;
      }
      grid = build();
      const found = new Set();
      const foundCells = new Set();
      body.innerHTML = '';
      body.append(tabs());
      body.append(h('div', { class: 'g-top' }, h('span', {}, 'Слова из состава шампуня Multiuse'), h('b', {}, '0 / ' + FW.length)));
      const fw = h('div', { class: 'fw' });
      const cells = [];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const c = h('div', {}, grid[y][x]);
        c.dataset.x = x; c.dataset.y = y;
        cells.push(c); fw.append(c);
      }
      const wl = h('div', { class: 'wl' });
      FW.forEach((w) => { const e = h('span', {}, w); e.dataset.w = w; wl.append(e); });
      body.append(fw, wl, h('div', { class: 'g-note' }, 'Веди пальцем по прямой линии: вправо, вниз или по диагонали. Слова могут идти и задом наперёд.'));

      let start = null, cur = [];
      const at = (x, y) => cells[y * N + x];
      function cellFrom(e) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        return el && fw.contains(el) && el !== fw ? el : null;
      }
      function line(a, b) {
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx && dy && Math.abs(dx) !== Math.abs(dy)) return [a];
        const n = Math.max(Math.abs(dx), Math.abs(dy));
        const sx = Math.sign(dx), sy = Math.sign(dy);
        return Array.from({ length: n + 1 }, (_, i) => ({ x: a.x + sx * i, y: a.y + sy * i }));
      }
      function paint() {
        cells.forEach((c) => c.classList.remove('sel'));
        cur.forEach((p) => at(p.x, p.y).classList.add('sel'));
      }
      fw.addEventListener('pointerdown', (e) => {
        const c = cellFrom(e); if (!c) return;
        start = { x: +c.dataset.x, y: +c.dataset.y }; cur = [start]; paint();
        fw.setPointerCapture(e.pointerId);
      });
      fw.addEventListener('pointermove', (e) => {
        if (!start) return;
        const c = cellFrom(e); if (!c) return;
        cur = line(start, { x: +c.dataset.x, y: +c.dataset.y }); paint();
      });
      const up = () => {
        if (!start) return;
        const str = cur.map((p) => grid[p.y][p.x]).join('');
        const rev = str.split('').reverse().join('');
        const w = FW.find((x) => !found.has(x) && (x === str || x === rev));
        if (w) {
          found.add(w);
          cur.forEach((p) => foundCells.add(p.y * N + p.x));
          cells.forEach((c, i) => c.classList.toggle('fd', foundCells.has(i)));
          wl.querySelector(`[data-w="${w}"]`).classList.add('fd');
          body.querySelector('.g-top b').textContent = found.size + ' / ' + FW.length;
          if (found.size === FW.length) setTimeout(() => !dead && Core.result(body, { win: true, text: 'Все слова найдены.', retryLabel: 'Сыграть в круг букв', onRetry: () => { mode = 'wheel'; wheel(); } }), 500);
        }
        start = null; cur = []; paint();
      };
      fw.addEventListener('pointerup', up);
      fw.addEventListener('pointercancel', up);
    }

    function tabs() {
      return h('div', { class: 'tabs' },
        h('button', { class: mode === 'wheel' ? 'on' : '', onclick: () => { mode = 'wheel'; wheel(); } }, 'Круг букв'),
        h('button', { class: mode === 'fw' ? 'on' : '', onclick: () => { mode = 'fw'; filword(); } }, 'Филворд'));
    }

    wheel();
    return () => { dead = true; };
  };
})();

(function () {
  const { h, U, productSVG } = Core;

  const TIERS = [
    { r: 15, vol: '20 мл', kind: 'dropper', col: '#ffd9ea' },
    { r: 18, vol: '50 мл', kind: 'tube', col: '#ffc2dd' },
    { r: 22, vol: '120 мл', kind: 'spray', col: '#ffa9cf' },
    { r: 26, vol: '150 мл', kind: 'bottle', col: '#ff8dbf' },
    { r: 31, vol: '200 мл', kind: 'pump', col: '#f26aa8' },
    { r: 36, vol: '245 г', kind: 'jar', col: '#e24891' },
    { r: 42, vol: '300 мл', kind: 'bottle', col: '#d4005f' },
    { r: 48, vol: '500 г', kind: 'jar', col: '#af004e' },
    { r: 55, vol: '750 мл', kind: 'pump', col: '#930043' },
    { r: 63, vol: '1000 мл', kind: 'bottle', col: '#7e0038' },
  ];

  Games.merge = function (body) {
    const W = 340, H = 460, LINE = 74, G = 900;
    let balls, dropX, cd, next, over, raf, last, high, dead = false, overT, score;
    const sprites = TIERS.map((t) => {
      const c = document.createElement('canvas');
      c.width = c.height = t.r * 2 + 2;
      const ctx = c.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.beginPath(); ctx.arc(t.r + 1, t.r + 1, t.r, 0, 7);
        const g = ctx.createRadialGradient(t.r * .7, t.r * .6, 2, t.r, t.r, t.r);
        g.addColorStop(0, '#fff'); g.addColorStop(1, t.col);
        ctx.fillStyle = g; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(126,0,56,.35)'; ctx.stroke();
        const sz = t.r * 1.45;
        ctx.drawImage(img, t.r + 1 - sz / 2, t.r + 1 - sz / 2 - 2, sz, sz);
        ctx.fillStyle = '#1a1118'; ctx.font = `700 ${Math.max(8, t.r * .3)}px Geologica, sans-serif`; ctx.textAlign = 'center';
        ctx.fillText(t.vol, t.r + 1, t.r * 1.9 - 2);
        c.ready = true;
      };
      img.src = U.svgURL(productSVG(t.kind, TIERS.indexOf(t) < 6 ? '#af004e' : '#ffd9ea', 64));
      return c;
    });

    const canvas = h('canvas', { width: W, height: H, style: { width: W + 'px', height: H + 'px', borderRadius: '16px', border: '1px solid var(--border)', background: '#fff', touchAction: 'none', flex: 'none' } });
    const ctx = canvas.getContext('2d');
    const top = h('div', { class: 'g-top' });
    body.append(top, canvas, h('div', { class: 'g-note' }, 'Выбери, где отпустить банку: веди пальцем и отпусти. Две одинаковые склеиваются в следующий размер. Собери самую большую, и игра закончится.'));

    function reset() {
      balls = []; dropX = W / 2; cd = 0; over = false; high = 0; overT = 0; score = 0; last = performance.now();
      next = U.ri(0, 2);
      const ov = body.querySelector('.overlay'); if (ov) ov.remove();
      showTop();
    }
    function showTop() {
      top.innerHTML = '';
      top.append(h('span', {}, 'Собрано: ', h('b', {}, (high ? TIERS[high].vol : '—') + ' (цель 1000 мл)')), h('span', {}, 'Дальше: ', h('b', {}, TIERS[next].vol)));
    }
    function drop() {
      if (over || cd > 0) return;
      const t = TIERS[next];
      const x = U.clamp(dropX, t.r + 4, W - t.r - 4);
      balls.push({ x, y: 36, vx: 0, vy: 40, t: next, r: t.r, age: 0, dead: false });
      next = U.ri(0, 3); cd = .55; showTop();
    }
    function pos(e) {
      const rc = canvas.getBoundingClientRect();
      dropX = (e.clientX - rc.left) * (W / rc.width);
    }
    canvas.addEventListener('pointerdown', (e) => { pos(e); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', (e) => pos(e));
    canvas.addEventListener('pointerup', (e) => { pos(e); drop(); });

    function step(dt) {
      for (const b of balls) {
        b.vy += G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.age += dt;
        b.vx *= .998;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * .2; }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * .2; }
        if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * .1; b.vx *= .96; }
      }
      const add = [];
      for (let it = 0; it < 3; it++) {
        for (let i = 0; i < balls.length; i++) {
          const a = balls[i]; if (a.dead) continue;
          for (let j = i + 1; j < balls.length; j++) {
            const b = balls[j]; if (b.dead) continue;
            const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
            const d2 = dx * dx + dy * dy;
            if (d2 >= min * min || d2 === 0) continue;
            const d = Math.sqrt(d2);
            if (a.t === b.t && a.t < 9 && it === 0) {
              a.dead = b.dead = true;
              const nt = a.t + 1;
              add.push({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2 - 40, t: nt, r: TIERS[nt].r, age: 2, dead: false });
              score += nt;
              continue;
            }
            const nx = dx / d, ny = dy / d, ov = min - d;
            const ma = a.r * a.r, mb = b.r * b.r, tm = ma + mb;
            a.x -= nx * ov * (mb / tm); a.y -= ny * ov * (mb / tm);
            b.x += nx * ov * (ma / tm); b.y += ny * ov * (ma / tm);
            const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (rv < 0) {
              const imp = -rv * 1.1;
              a.vx -= nx * imp * (mb / tm); a.vy -= ny * imp * (mb / tm);
              b.vx += nx * imp * (ma / tm); b.vy += ny * imp * (ma / tm);
            }
          }
        }
      }
      if (add.length) {
        balls = balls.filter((b) => !b.dead).concat(add);
        add.forEach((n) => { if (n.t > high) { high = n.t; showTop(); } });
        if (high >= 9 && !over) win();
      }
    }
    function win() {
      over = true;
      setTimeout(() => !dead && Core.result(body, { win: true, text: 'Собрана банка на 1000 мл. Игра закончена.', onRetry: reset }), 700);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.setLineDash([6, 6]); ctx.strokeStyle = '#e29a9a'; ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke(); ctx.setLineDash([]);
      for (const b of balls) {
        const sp = sprites[b.t];
        if (sp.ready) ctx.drawImage(sp, b.x - b.r - 1, b.y - b.r - 1);
        else { ctx.fillStyle = TIERS[b.t].col; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }
      }
      if (!over) {
        const t = TIERS[next];
        const x = U.clamp(dropX, t.r + 4, W - t.r - 4);
        ctx.globalAlpha = cd > 0 ? .25 : .7;
        const sp = sprites[next];
        if (sp.ready) ctx.drawImage(sp, x - t.r - 1, 36 - t.r - 1);
        ctx.globalAlpha = .25; ctx.strokeStyle = '#af004e'; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(x, 36 + t.r); ctx.lineTo(x, H); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
    }

    function loop(now) {
      if (dead) return;
      const dt = Math.min(.033, (now - last) / 1000); last = now;
      if (!over) {
        cd = Math.max(0, cd - dt);
        for (let k = 0; k < 2; k++) step(dt / 2);
        const risky = balls.some((b) => b.age > 1.4 && b.y - b.r < LINE);
        overT = risky ? overT + dt : Math.max(0, overT - dt);
        if (overT > 2) {
          over = true;
          Core.result(body, { win: false, title: 'Банка переполнилась', text: 'Склеивай одинаковые чаще, тогда места хватит.', onRetry: reset });
        }
      }
      draw();
      raf = requestAnimationFrame(loop);
    }
    reset();
    raf = requestAnimationFrame(loop);
    return () => { dead = true; cancelAnimationFrame(raf); };
  };
})();

(function () {
  const { h, U, productSVG, flarik } = Core;

  Games.flyer = function (body) {
    const W = 340, H = 460, JX = 90, JR = 12, SPEED = 125;
    let y, vy, started, over, stage, ents, spawnX, camX, last, raf, dead = false, flash = 0, toSpawn;
    const jarImg = new Image(); jarImg.src = U.svgURL(productSVG('jar', '#d4005f', 64));
    const flImg = new Image(); flImg.src = U.svgURL(flarik('happy', 64));

    const canvas = h('canvas', { width: W, height: H, style: { width: W + 'px', height: H + 'px', borderRadius: '16px', border: '1px solid var(--border)', background: '#fff7fb', touchAction: 'none', flex: 'none' } });
    const ctx = canvas.getContext('2d');
    canvas.__dbg = () => ({ y, vy, ents, camX, stage, over });
    const top = h('div', { class: 'g-top' });
    body.append(top, canvas, h('div', { class: 'g-note' }, 'Тап — банка летит вверх. Между этапами пролетай через кольцо в виде Фларика. Десятое кольцо — финал.'));

    function queueStage(n) {
      const cnt = 1 + Math.floor((n - 1) / 3);
      const gap = 168 - n * 4;
      for (let i = 0; i < cnt; i++) {
        spawnX += 190;
        ents.push({ k: 'pipe', x: spawnX, gy: U.rand(130, H - 130), gap, passed: false });
      }
      spawnX += 200;
      ents.push({ k: 'ring', x: spawnX, cy: U.rand(150, H - 150), hr: 46, passed: false, n });
    }

    function reset() {
      y = H / 2; vy = 0; started = false; over = false; stage = 1; ents = []; spawnX = 260; camX = 0; flash = 0; last = performance.now();
      queueStage(1);
      const ov = body.querySelector('.overlay'); if (ov) ov.remove();
      showTop();
    }
    function showTop() {
      top.innerHTML = '';
      const dots = Array.from({ length: 10 }, (_, i) => (i < stage - 1 ? '●' : '○')).join('');
      top.append(h('span', {}, 'Этап ', h('b', {}, stage + ' / 10')), h('span', { style: { color: 'var(--crimson)', letterSpacing: '1px', fontSize: '12px' } }, dots));
    }
    function tap() {
      if (over) return;
      started = true; vy = -300;
    }
    canvas.addEventListener('pointerdown', tap);
    const key = (e) => { if (e.code === 'Space' && body.isConnected) { e.preventDefault(); tap(); } };
    window.addEventListener('keydown', key);

    function lose(txt) {
      over = true;
      Core.result(body, { win: false, title: 'Не долетела', text: txt, onRetry: reset });
    }

    function update(dt) {
      if (!started) { y = H / 2 + Math.sin(performance.now() / 300) * 6; return; }
      vy += 900 * dt; y += vy * dt; camX += SPEED * dt;
      if (y < JR || y > H - JR) return lose('Банка упала. Тапай чаще и ровнее.');
      for (const e of ents) {
        const sx = e.x - camX;
        if (e.k === 'pipe') {
          if (JX + JR > sx && JX - JR < sx + 46) {
            if (y - JR < e.gy - e.gap / 2 || y + JR > e.gy + e.gap / 2) return lose('Задела блок. Пробуй ещё.');
          }
        } else {
          const dx = Math.abs(JX - sx);
          if (!e.passed) {

(function () {
  const { h, U, icon } = Core;
  const TYPES = ['bank', 'drop', 'smear', 'foam', 'spray', 'pipette', 'cap', 'components'];
  const SIZES = [8, 6, 5, 3, 2];
  const TW = 40, TH = 50, STEP = 34;

  Games.pyramid = function (body) {
    let tiles, hand, undos, over, timers = [], dead = false;
    const later = (fn, ms) => timers.push(setTimeout(() => !dead && fn(), ms));

    function layout() {
      const out = [];
      SIZES.forEach((n, layer) => {
        for (let i = 0; i < n; i++) {
          out.push({ layer, x: 170 + (i - (n - 1) / 2) * (TW + 2) - TW / 2, y: 215 - layer * STEP, gone: false, type: null });
        }
      });
      return out;
    }
    const overlap = (a, b) => {
      const w = Math.min(a.x + TW, b.x + TW) - Math.max(a.x, b.x);
      const hh = Math.min(a.y + TH, b.y + TH) - Math.max(a.y, b.y);
      return w > 0 && hh > 0 ? w * hh : 0;
    };
    const covered = (t, list) => list.some((u) => !u.gone && u.layer > t.layer && overlap(t, u) > TW * TH * 0.12);

    function build() {
      for (let attempt = 0; attempt < 300; attempt++) {
        const ts = layout();

          const arr = [...rest];

          if (free.length < 3) { ok = false; break; }
          const three = U.shuffle(free).slice(0, 3);

          three.forEach((t) => { t.type = ty; rest.delete(t); });
        }

    }

    }

    function tap(t) {
      if (over || t.gone || covered(t, tiles) || hand.length >= 5) return;

      render();
      const same = hand.filter((x) => x.type === t.type);

        over = true;

          hand = hand.filter((x) => x.type !== t.type);

    }

      body.innerHTML = '';

        pyr.append(el);

      body.append(h('div', { class: 'g-note' }, 'Бери только открытые карты (с розовой рамкой). Три одинаковые в руке исчезают. Рука на 5 мест, не переполни её.'));

  };

        p('От самого простого к самому сложному. Каждый следующий шаг можно делать, только если предыдущий уже работает.'),
        step(1, 'Сейчас: уже есть', ul(['Миссия дня, ситуативка, видео, инвайт, обучение', 'Из новых форматов можно собрать на текущих механиках: «Нажми по порядку», «Найди на картинке» картинкой с метками, квизы на слова']), 'now'),
        step(2, 'Кнопки, поиск и слова', ul(['«Нажми по порядку», «Найди на картинке», «Собери слова»', 'Самые простые экраны, нужны сразу']), ''),
        step(3, 'Разложить', ul(['Колбы, корзинки, пирамидка', 'Одна игра такого типа в неделю']), ''),
        step(4, 'Аркада', ul(['«Большая банка», «Пролети кольцо»', 'Нужна физика и хорошая настройка баланса']), ''),
        step(5, 'Уход за волосами', ul(['Игра с головой клиентки', 'Шаги берём из карточек продуктов']), ''),
        step(6, 'Вдвоём', ul(['«Играй с подругой»: приглашение', 'Колбы вдвоём, уход вдвоём, потом «Смена вдвоём»', 'Нужна игра на двух телефонах одновременно']), 'future'),
        step('+', 'Слои и настройки, когда будет время', ul(['Секрет Фларика, Фларик сети, календарь смен, заметки', 'Они не зависят от игр и можно делать параллельно']), '')));
    },
  });
  S.push({
    id: 'final', sec: 'Как реализуем', title: 'Итог',
    render(root) {
      root.append(h('div', { class: 'slide hero' }, h('div', { class: 'bob', html: Core.flarik('love', 100) }), h('h1', {}, 'Что дальше'),
        ul(['Выбрать, с каких двух-трёх игр начнём (по порядку внедрения это «Нажми по порядку», «Найди на картинке», «Собери слова»)', 'Определить, какие данные команда будет заполнять: слова, шаги нанесения, список предметов', 'Назначить даты для идей на день рождения и Новый год', 'Решить, нужны ли календарь смен и заметки в первой версии']),
        h('p', { class: 'lead' }, 'Новые форматы можно добавлять по тем же правилам. Для этого сохранён навык «Новые форматы геймификации».')));
    },
  });

  window.SLIDES = S;
  window.ALL_GAMES = ALL_GAMES;

  /* ---------- движок ---------- */
  const stage = document.getElementById('stage');
  const side = document.getElementById('side');
  let cur = -1, cleanup = null;
  function go(target) {
    const i = typeof target === 'number' ? target : S.findIndex((s) => s.id === target);
    if (i < 0 || i >= S.length) return;
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    stage.innerHTML = '';
    cur = i;
    const r = S[i].render(stage);
    cleanup = typeof r === 'function' ? r : null;
    stage.scrollTop = 0;
    location.hash = S[i].id;
    document.querySelectorAll('#side a').forEach((a) => a.classList.toggle('on', a.dataset.id === S[i].id));
    const on = document.querySelector('#side a.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    document.querySelector('#bar .grow i').style.width = ((i + 1) / S.length) * 100 + '%';
    document.querySelector('#bar .cnt').textContent = (i + 1) + ' / ' + S.length;
    document.querySelector('#bar .prev').disabled = i === 0;
    document.querySelector('#bar .next').disabled = i === S.length - 1;
  }
  window.go = go;

  function buildSide() {
    side.innerHTML = '';
    side.append(h('div', { class: 'brand', html: Core.flarik('happy', 28) + ' Flario Game' }));
    let sec = '';
    S.forEach((s) => {
      if (s.sec !== sec) { sec = s.sec; side.append(h('div', { class: 'sec' }, sec)); }
      if (s.id.startsWith('d') && /^d\d$/.test(s.id)) return;
      const a = h('a', { 'data-id': s.id, onclick: () => go(s.id) }, s.play ? h('span', { class: 'play' }, '▶') : null, s.title);
      side.append(a);
    });
  }
  function fit() {
    const hh = window.innerHeight - 56 - 28;
    document.documentElement.style.setProperty('--s', Math.min(1, hh / 660).toFixed(3));
  }
  window.addEventListener('resize', fit); fit();
  buildSide();
  document.querySelector('#bar .prev').onclick = () => go(cur - 1);
  document.querySelector('#bar .next').onclick = () => go(cur + 1);
  window.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  });
  window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && S[cur] && S[cur].id !== id) go(id); });
  go(location.hash.slice(1) || 0);
})();
</script>
</body>
</html>
